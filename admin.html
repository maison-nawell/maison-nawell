<button id="deconnexion" type="button">
    DÉCONNEXION
</button>
<section class="admin-welcome">
    <h2>Tableau de bord</h2>
    <p id="admin-email"></p>
</section>

<!-- RENDEZ-VOUS -->

<section class="admin-section">

    <div class="section-title">
        <div>
            <h2>Rendez-vous</h2>
            <p>Les réservations des clientes</p>
        </div>

        <button
            id="actualiser-reservations"
            type="button"
        >
            ACTUALISER
        </button>
    </div>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Horaire</th>
                    <th>Cliente</th>
                    <th>Téléphone</th>
                    <th>Prestation</th>
                    <th>Statut</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="reservations">
                <tr>
                    <td colspan="7">
                        Chargement...
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

</section>


<!-- PRESTATIONS -->

<section class="admin-section">

    <div class="section-title">
        <div>
            <h2>Prestations</h2>
            <p>Gérer les prestations affichées sur le site</p>
        </div>

        <button
            id="nouvelle-prestation"
            type="button"
        >
            + AJOUTER UNE PRESTATION
        </button>
    </div>


    <!-- FORMULAIRE -->

    <div
        id="formulaire-prestation"
        class="formulaire-prestation"
        hidden
    >

        <h3 id="titre-formulaire">
            Ajouter une prestation
        </h3>

        <input
            type="hidden"
            id="prestation-id"
        >

        <label for="prestation-nom">
            Nom de la prestation
        </label>

        <input
            type="text"
            id="prestation-nom"
            placeholder="Ex : Pose complète"
        >


        <label for="prestation-description">
            Description
        </label>

        <textarea
            id="prestation-description"
            placeholder="Description de la prestation"
        ></textarea>


        <label for="prestation-duree">
            Durée en minutes
        </label>

        <input
            type="number"
            id="prestation-duree"
            min="30"
            step="30"
            placeholder="Ex : 120"
        >


        <label for="prestation-prix">
            Prix
        </label>

        <input
            type="number"
            id="prestation-prix"
            min="0"
            step="0.01"
            placeholder="Ex : 50"
        >


        <label for="prestation-photo">
            Photo
        </label>

        <input
            type="file"
            id="prestation-photo"
            accept="image/jpeg,image/png,image/webp"
        >

        <p class="photo-info">
            JPG, PNG ou WEBP.
        </p>


        <div class="form-buttons">

            <button
                id="annuler-formulaire"
                type="button"
            >
                ANNULER
            </button>

            <button
                id="sauvegarder-prestation"
                type="button"
            >
                ENREGISTRER
            </button>

        </div>

        <p id="message-prestation"></p>

    </div>


    <!-- LISTE -->

    <div
        id="liste-prestations"
        class="liste-prestations"
    >
        Chargement...
    </div>

</section>
